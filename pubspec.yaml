name: asiste
description: "Asiste — asistente de voz inteligente para programar alarmas, eventos y recordatorios."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Red / backend de Gemini
  http: ^1.2.2

  # Estado
  provider: ^6.1.2

  # Persistencia
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # Voz
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

  # Notificaciones / alarmas
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # Calendario
  table_calendar: ^3.1.3

  # Permisos
  permission_handler: ^11.3.1

  # Utilidades
  intl: ^0.19.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
